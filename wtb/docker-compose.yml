services:
  # PostgreSQL база данных
  db:
    image: postgres:11
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-5YE2w8bxd9}
      - POSTGRES_DB=${POSTGRES_DB:-wireguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn_network

  # API сервис для взаимодействия с базой данных
  database-service:
    build: ./database-service
    restart: always
    volumes:
      - ./database-service/data:/app/data
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-5YE2w8bxd9}
      - POSTGRES_DB=${POSTGRES_DB:-wireguard}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-fvcfq9d3ycefnvmftiaso}
      - API_GATEWAY_URL=http://kong:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vpn_network

  # Веб-интерфейс администратора
  admin-panel:
    build: ./admin-panel
    restart: always
    volumes:
      - ./admin-panel:/app
    environment:
      - API_GATEWAY_URL=http://kong:8000
      - USE_MOCK_DATA=false
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-fvcfq9d3ycefnvmftiaso}
      - FLASK_ENV=${FLASK_ENV:-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    ports:
      - "5000:5000"  # Добавлен маппинг портов
    depends_on:
      database-service:
        condition: service_healthy
      wireguard-proxy:
        condition: service_healthy
      kong:
        condition: service_healthy
    networks:
      - vpn_network

  # Телеграм-бот
  telegram-service:
    build: ./telegram-service
    restart: always
    volumes:
      - ./telegram-service:/app
      - ./.env:/app/.env
    environment:
      - API_GATEWAY_URL=http://kong:8000
      - TELEGRAM_API_TOKEN=${TELEGRAM_TOKEN}
      - PAYMENT_TOKEN=${PAYMENT_TOKEN:-test}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-fvcfq9d3ycefnvmftiaso}
      - REMOTE_ONLY=${REMOTE_ONLY:-true}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      database-service:
        condition: service_healthy
      wireguard-proxy:
        condition: service_healthy
      kong:
        condition: service_healthy
    networks:
      - vpn_network

  # Прокси для WireGuard серверов
  wireguard-proxy:
    build: ./wireguard-proxy
    restart: always
    volumes:
      - ./wireguard-proxy:/app
      - ./config:/app/config
    environment:
      - DATABASE_SERVICE_URL=http://database-service:5002
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CACHE_TTL=${CACHE_TTL:-300}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-10}
      - HTTP_MAX_RETRIES=${HTTP_MAX_RETRIES:-3}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-fvcfq9d3ycefnvmftiaso}
      - API_GATEWAY_URL=http://kong:8000
    depends_on:
      database-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vpn_network

  # Сервис сбора метрик
  metrics-collector:
    build: ./metrics-collector
    restart: no
    volumes:
      - ./metrics-collector:/app
    environment:
      - API_GATEWAY_URL=http://kong:8000
      - COLLECTION_INTERVAL=${COLLECTION_INTERVAL:-120}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-fvcfq9d3ycefnvmftiaso}
    depends_on:
      database-service:
        condition: service_healthy
      wireguard-proxy:
        condition: service_healthy
      kong:
        condition: service_healthy
    networks:
      - vpn_network

  # Сервис миграции пользователей
  migration-service:
    build: ./migration-service
    restart: on-failure
    volumes:
      - ./migration-service:/app
    environment:
      - API_GATEWAY_URL=http://kong:8000
      - STARTUP_DELAY=${STARTUP_DELAY:-60}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-fvcfq9d3ycefnvmftiaso}
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-5YE2w8bxd9}
      - POSTGRES_DB=${POSTGRES_DB:-wireguard}
    depends_on:
      database-service:
        condition: service_healthy
      wireguard-proxy:
        condition: service_healthy
      kong:
        condition: service_healthy
    networks:
      - vpn_network

  # Kong Database
  kong-database:
    image: postgres:11
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD:-kong_pass}
    volumes:
      - kong-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - vpn_network

  # Kong Migration
  kong-migration:
    image: kong:3.0
    container_name: kong-migration
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong_pass}
    command: kong migrations bootstrap
    restart: on-failure
    networks:
      - vpn_network

  # Kong API Gateway
  kong:
    image: kong:3.0
    container_name: kong-gateway
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong_pass}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_DB_PASSWORD: ${KONG_DB_PASSWORD:-kong_pass}
      KONGA_TOKEN_SECRET: ${KONGA_TOKEN_SECRET:-konga_secret_token}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-fvcfq9d3ycefnvmftiaso}
    ports:
      - "8000:8000" # Kong proxy
      - "8443:8443" # Kong proxy SSL
      - "8001:8001" # Kong admin API
      - "8444:8444" # Kong admin API SSL
    restart: always
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpn_network

  # Подготовка базы данных для Konga
  konga-prepare:
    image: pantsel/konga:0.14.9
    container_name: konga-prepare
    command: "-c prepare -a postgres -u postgresql://kong:${KONG_DB_PASSWORD:-kong_pass}@kong-database:5432/konga"
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure
    networks:
      - vpn_network

  # Konga - Admin UI для Kong
  konga:
    image: pantsel/konga:0.14.9
    container_name: konga
    depends_on:
      kong:
        condition: service_healthy
      konga-prepare:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TOKEN_SECRET: ${KONGA_TOKEN_SECRET:-konga_secret_token}
      DB_ADAPTER: postgres
      DB_URI: postgresql://kong:${KONG_DB_PASSWORD:-kong_pass}@kong-database:5432/konga
      KONGA_HOOK_TIMEOUT: 120000
      DB_PG_SCHEMA: public
    ports:
      - "1337:1337"
    restart: always
    networks:
      - vpn_network

# Сети
networks:
  vpn_network:
    driver: bridge

# Тома для хранения данных
volumes:
  postgres_data:
  kong-data: