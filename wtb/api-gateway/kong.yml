# api-gateway/kong.yml
_format_version: "3.0"
_transform: true

services:
  - name: database-service
    url: http://wtb-database-service-1:5002
    protocol: http
    host: wtb-database-service-1
    port: 5002
    path: /
    retries: 5
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: database-api-route
        protocols: ["http", "https"]
        paths: ["/api"]
        strip_path: false
        preserve_host: false
        regex_priority: 200
      - name: database-health-route
        protocols: ["http", "https"]
        paths: ["/health"]
        strip_path: false
        preserve_host: false
        regex_priority: 100

  - name: wireguard-proxy
    url: http://wtb-wireguard-proxy-1:5001
    protocol: http
    host: wtb-wireguard-proxy-1
    port: 5001
    path: /
    retries: 5
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: wireguard-vpn-route
        protocols: ["http", "https"]
        paths: ["/vpn"]
        strip_path: true
        preserve_host: false
        regex_priority: 200
      - name: wireguard-health-route
        protocols: ["http", "https"]
        paths: ["/wg-health"]
        strip_path: true
        preserve_host: false
        regex_priority: 100

plugins:
  - name: key-auth
    config:
      key_names:
        - apikey
      hide_credentials: true
      anonymous: null
      key_in_body: false
      run_on_preflight: true

consumers:
  - username: admin
    keyauth_credentials:
      - key: fvcfq9d3ycefnvmftiaso