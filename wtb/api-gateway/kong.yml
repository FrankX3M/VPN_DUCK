# Исправленная конфигурация Kong API Gateway (kong.yml)
services:
  - name: database-service
    url: http://database-service:5002
    protocol: http
    host: database-service
    port: 5002
    path: /api  # Изменено: добавлен префикс /api в базовый путь
    retries: 5
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: database-api-route
        protocols: ["http", "https"]
        paths: ["/api"]
        strip_path: true  # Оставляем true, но меняем path в url
        preserve_host: true
        regex_priority: 200
      - name: database-root-route
        protocols: ["http", "https"]
        paths: ["/"]
        strip_path: false
        preserve_host: true
        regex_priority: 100

  - name: wireguard-proxy
    url: http://wireguard-proxy:5001
    protocol: http
    host: wireguard-proxy
    port: 5001
    path: /  # Базовый путь без префикса
    retries: 5
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: wireguard-api-route
        protocols: ["http", "https"]
        paths: ["/vpn"]
        strip_path: true  # Оставляем true, т.к. маршруты в wireguard-proxy не имеют префикса
        preserve_host: true
        regex_priority: 200
      - name: wireguard-health-route
        protocols: ["http", "https"]
        paths: ["/health"]
        strip_path: false
        preserve_host: true
        regex_priority: 100
plugins:
  - name: key-auth
    config:
      key_names:
        - apikey
      hide_credentials: true
      anonymous: null
      key_in_body: false
      run_on_preflight: true