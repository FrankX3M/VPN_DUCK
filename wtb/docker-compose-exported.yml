name: wtb
services:
  admin-panel:
    build:
      context: /root/VPN_DUCK/wtb/admin-panel
      dockerfile: Dockerfile
    depends_on:
      database-service:
        condition: service_healthy
        required: true
      kong:
        condition: service_healthy
        required: true
      wireguard-proxy:
        condition: service_healthy
        required: true
    environment:
      ADMIN_PASSWORD: admin
      ADMIN_SECRET_KEY: fvcfq9d3ycefnvmftiaso
      ADMIN_USERNAME: admin
      API_GATEWAY_URL: http://kong:8000
      FLASK_ENV: production
      USE_MOCK_DATA: "false"
    networks:
      vpn_network: null
    restart: always
    volumes:
      - type: bind
        source: /root/VPN_DUCK/wtb/admin-panel
        target: /app
        bind:
          create_host_path: true
  database-service:
    build:
      context: /root/VPN_DUCK/wtb/database-service
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      ADMIN_SECRET_KEY: fvcfq9d3ycefnvmftiaso
      API_GATEWAY_URL: http://kong:8000
      POSTGRES_DB: wireguard
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: 5YE2w8bxd9
      POSTGRES_USER: postgres
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5002/health
      timeout: 5s
      interval: 10s
      retries: 3
    networks:
      vpn_network: null
    restart: always
    volumes:
      - type: bind
        source: /root/VPN_DUCK/wtb/database-service/data
        target: /app/data
        bind:
          create_host_path: true
  db:
    environment:
      POSTGRES_DB: wireguard
      POSTGRES_PASSWORD: 5YE2w8bxd9
      POSTGRES_USER: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      timeout: 5s
      interval: 5s
      retries: 5
    image: postgres:13
    networks:
      vpn_network: null
    restart: always
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
  kong:
    container_name: kong-gateway
    depends_on:
      kong-database:
        condition: service_started
        required: true
      kong-migration:
        condition: service_started
        required: true
    environment:
      ADMIN_SECRET_KEY: fvcfq9d3ycefnvmftiaso
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_DATABASE: postgres
      KONG_DB_PASSWORD: kong_pass
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kong_pass
      KONG_PG_USER: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONGA_TOKEN_SECRET: konga_secret_token
    healthcheck:
      test:
        - CMD
        - kong
        - health
      timeout: 5s
      interval: 10s
      retries: 5
    image: kong:3.0
    networks:
      vpn_network: null
    ports:
      - mode: ingress
        target: 8000
        published: "8000"
        protocol: tcp
      - mode: ingress
        target: 8443
        published: "8443"
        protocol: tcp
      - mode: ingress
        target: 8001
        published: "8001"
        protocol: tcp
      - mode: ingress
        target: 8444
        published: "8444"
        protocol: tcp
    restart: always
  kong-database:
    container_name: kong-database
    environment:
      POSTGRES_DB: kong
      POSTGRES_MULTIPLE_DATABASES: kong,konga
      POSTGRES_PASSWORD: kong_pass
      POSTGRES_USER: kong
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - kong
      timeout: 5s
      interval: 10s
      retries: 5
    image: postgres:13
    networks:
      vpn_network: null
    restart: always
    volumes:
      - type: volume
        source: kong-data
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: /root/VPN_DUCK/wtb/init-multiple-postgresql-databases.sh
        target: /docker-entrypoint-initdb.d/init-multiple-postgresql-databases.sh
        bind:
          create_host_path: true
  kong-migration:
    command:
      - kong
      - migrations
      - bootstrap
    container_name: kong-migration
    depends_on:
      kong-database:
        condition: service_started
        required: true
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kong_pass
      KONG_PG_USER: kong
    image: kong:3.0
    networks:
      vpn_network: null
    restart: on-failure
  konga:
    container_name: konga
    depends_on:
      kong:
        condition: service_started
        required: true
    environment:
      DB_ADAPTER: postgres
      DB_URI: postgresql://kong:kong_pass@kong-database:5432/konga
      NODE_ENV: production
      TOKEN_SECRET: konga_secret_token
    image: pantsel/konga:0.14.9
    networks:
      vpn_network: null
    ports:
      - mode: ingress
        target: 1337
        published: "1337"
        protocol: tcp
    restart: always
  metrics-collector:
    build:
      context: /root/VPN_DUCK/wtb/metrics-collector
      dockerfile: Dockerfile
    depends_on:
      database-service:
        condition: service_healthy
        required: true
      kong:
        condition: service_healthy
        required: true
      wireguard-proxy:
        condition: service_healthy
        required: true
    environment:
      ADMIN_SECRET_KEY: fvcfq9d3ycefnvmftiaso
      API_GATEWAY_URL: http://kong:8000
      COLLECTION_INTERVAL: "120"
    networks:
      vpn_network: null
    restart: always
    volumes:
      - type: bind
        source: /root/VPN_DUCK/wtb/metrics-collector
        target: /app
        bind:
          create_host_path: true
  migration-service:
    build:
      context: /root/VPN_DUCK/wtb/migration-service
      dockerfile: Dockerfile
    depends_on:
      database-service:
        condition: service_healthy
        required: true
      kong:
        condition: service_healthy
        required: true
      wireguard-proxy:
        condition: service_healthy
        required: true
    environment:
      ADMIN_SECRET_KEY: fvcfq9d3ycefnvmftiaso
      API_GATEWAY_URL: http://kong:8000
      POSTGRES_DB: wireguard
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: 5YE2w8bxd9
      POSTGRES_USER: postgres
      STARTUP_DELAY: "60"
    networks:
      vpn_network: null
    restart: on-failure
    volumes:
      - type: bind
        source: /root/VPN_DUCK/wtb/migration-service
        target: /app
        bind:
          create_host_path: true
  pgadmin:
    depends_on:
      db:
        condition: service_started
        required: true
    environment:
      PGADMIN_DEFAULT_EMAIL: 9167700@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Crjnj,jpf55
    image: dpage/pgadmin4
    networks:
      vpn_network: null
    ports:
      - mode: ingress
        target: 80
        published: "5050"
        protocol: tcp
  telegram-service:
    build:
      context: /root/VPN_DUCK/wtb/telegram-service
      dockerfile: Dockerfile
    depends_on:
      database-service:
        condition: service_healthy
        required: true
      kong:
        condition: service_healthy
        required: true
      wireguard-proxy:
        condition: service_healthy
        required: true
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      ADMIN_SECRET_KEY: fvcfq9d3ycefnvmftiaso
      API_GATEWAY_URL: http://kong:8000
      PAYMENT_TOKEN: test
      REMOTE_ONLY: "true"
      TELEGRAM_API_TOKEN: 7571318115:AAEhSzFzWNa4xcJ2rZTTaLPISZN9SJ1GnsY
    networks:
      vpn_network: null
    restart: always
    volumes:
      - type: bind
        source: /root/VPN_DUCK/wtb/telegram-service
        target: /app
        bind:
          create_host_path: true
      - type: bind
        source: /root/VPN_DUCK/wtb/.env
        target: /app/.env
        bind:
          create_host_path: true
  wireguard-proxy:
    build:
      context: /root/VPN_DUCK/wtb/wireguard-proxy
      dockerfile: Dockerfile
    depends_on:
      database-service:
        condition: service_healthy
        required: true
    environment:
      ADMIN_SECRET_KEY: fvcfq9d3ycefnvmftiaso
      API_GATEWAY_URL: http://kong:8000
      CACHE_TTL: "300"
      DATABASE_SERVICE_URL: http://database-service:5002
      DEBUG: "False"
      HTTP_MAX_RETRIES: "3"
      HTTP_TIMEOUT: "10"
      LOG_LEVEL: INFO
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5001/health
      timeout: 5s
      interval: 10s
      retries: 3
    networks:
      vpn_network: null
    restart: always
    volumes:
      - type: bind
        source: /root/VPN_DUCK/wtb/wireguard-proxy
        target: /app
        bind:
          create_host_path: true
      - type: bind
        source: /root/VPN_DUCK/wtb/config
        target: /app/config
        bind:
          create_host_path: true
networks:
  vpn_network:
    name: wtb_vpn_network
    driver: bridge
volumes:
  kong-data:
    name: wtb_kong-data
  postgres_data:
    name: wtb_postgres_data
